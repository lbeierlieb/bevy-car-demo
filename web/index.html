<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Sim</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1d22; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
               color: #ddd; font: 24px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">Loading cars…</div>
  <canvas id="bevy" tabindex="0"></canvas>
  <script>
    // Browsers start an AudioContext suspended unless the page had a click or key press
    // before it was made, and cpal asks to resume it only once, at startup. Resume every
    // context on the user's input, or the game stays silent if loading finished first.
    const audioContexts = [];
    const NativeAudioContext = window.AudioContext;
    window.AudioContext = class extends NativeAudioContext {
      constructor(...args) { super(...args); audioContexts.push(this); }
    };
    for (const event of ['pointerdown', 'keydown', 'touchend']) {
      document.addEventListener(event, () => {
        for (const ctx of audioContexts) if (ctx.state === 'suspended') ctx.resume();
      }, { capture: true });
    }

    // The F keys belong to the browser (F5 reloads, F11 goes fullscreen): the game has
    // none, and winit would cancel them in its listeners on the canvas, so they stop
    // here, on the way down, before reaching it.
    for (const event of ['keydown', 'keyup']) {
      window.addEventListener(event, (e) => {
        if (/^F([1-9]|1[0-2])$/.test(e.code)) e.stopImmediatePropagation();
      }, { capture: true });
    }
  </script>
  <script type="module">
    import init from './car-sim.js';
    const canvas = document.getElementById('bevy');
    canvas.focus();
    canvas.addEventListener('click', () => canvas.focus());
    init()
      .catch((e) => {
        // winit uses an exception to hand control to the browser event loop.
        if (!String(e).includes('Using exceptions for control flow')) throw e;
      })
      .finally(() => document.getElementById('loading').remove());
  </script>
</body>
</html>

# Where the events are, for the server (server --events FILE; services.car-sim.events).
# Without a list the server has none.
# One per line: kind, then the map point (x east, z south, in metres, as the map (M) and the
# gizmo view (1) show them), then the name. The marker is put exactly there.
# Kinds: hunt (a car hunt: one hunted, the others hunting), race (races and time trials).
# Under a race come its routes, each a line `route loop NAME` (laps, back to its first
# point) or `route sprint NAME` (from its first point to its last), then the points it
# passes through, `x z` a line. The server finds the way along the roads between them
# (the shortest, tracks and narrow lanes counting longer), so a point where the route
# turns off at a junction keeps it on the road meant; it refuses a route that turns
# back at a point or a point more than 30 m from a road, and says which. Races start
# at a route's first point, wherever the marker is.
# Names are made up: no real businesses or brands.

# Baunach: the middle of the supermarket's parking lot by Haßbergstraße.
hunt   -87  2286  Car Hunt Baunach

# Baunach: the same parking lot, its east side.
race   -62  2280  Races Baunach

# Where the events are, for the server (server --events FILE; services.car-sim.events).
# Without a list the server has none.
# One per line: kind, then the map point (x east, z south, in metres, as the map (M) and the
# gizmo view (1) show them), then the name. The marker is put exactly there.
# Kinds: hunt (a car hunt: one hunted, the others hunting), race (races and time trials).
# Under a race come its routes, made with the race editor (cargo run --bin races), which
# exports one to paste here: a line `route loop NAME` (laps) or `route sprint NAME`, then
# its grid spots, `grid x z heading` a line (compass degrees; pole is the one nearest the
# first checkpoint), then its checkpoints, `x z` a line, each a gate. A sprint goes from
# its first checkpoint to its last; a loop's laps end at its first. The server finds the
# way along the roads between them (the shortest, tracks and narrow lanes counting longer)
# and refuses a route that turns back at a checkpoint, a checkpoint more than 30 m from a
# road, or a lap under 500 m, and says which.
# Names are made up: no real businesses or brands.


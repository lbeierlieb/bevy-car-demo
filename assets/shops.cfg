# Where the shops are, for the server (server --shops FILE; services.car-sim.shops).
# Without a list the server has no shops.
# One per line: kind, then the map point of the building (x east, z south, in metres,
# as the map editor shows them), then the name. The marker goes on the nearest paved
# road, at its edge on the building's side.
# Kinds: showroom (stock cars), car (a workshop: stock parts, fits anything but a long
# block's insides), tuning (the same with tuning parts), tire (rims and tires, the only
# place they're put together or apart), alignment, paint, gas, dyno, garage (the garage
# park: everyone's own garage; one is enough), engine (long blocks only: their insides,
# rebores, engines swapped; keeps one engine and one long block for each player).
# Lines starting with "sells" under a shop say what it sells: ids of the catalogue's
# parts and assemblies (a showroom's: trims), exact or ending in * for every id starting
# with what's before it. A shop sells nothing it doesn't list.
# Names are made up: no real businesses or brands.

# Gerach and Reckendorf, 1.6 km apart, share one of most kinds (the dyno and the tuning
# shop are the ones south of Gerach); Baunach and Rattelsdorf have one of most kinds
# (Rattelsdorf a car workshop, Baunach a tuning shop and the engine shop).


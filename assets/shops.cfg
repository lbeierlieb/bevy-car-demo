# Where the shops are, for the server (server --shops FILE; services.car-sim.shops).
# Without a list the server has no shops.
# One per line: kind, then the map point of the building (x east, z south, in metres,
# as the map editor shows them), then the name. The marker goes on the nearest paved
# road, at its edge on the building's side.

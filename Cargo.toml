[package]
name = "car-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy car simulation demo: rigid-body chassis, double A-arm suspension, raycast tires"
default-run = "car-sim"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "keyboard", "mouse", "bevy_audio", "bevy_gilrs"] }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
# The baked terrain file is zlib-compressed.
miniz_oxide = "0.9"
# The map file (`osm.rs`, shared with the bake).
quick-xml = "0.42"
# Name tags over other players' cars are drawn into textures in egui's font (both already
# built for egui and winit).
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"

# Force feedback for steering wheels goes straight to the kernel's evdev interface.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

# On the web, multiplayer goes through the browser's WebTransport (bound by hand in
# `net/web.rs`, as web-sys only has it behind an unstable flag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Location",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Storage",
  "Window",
  "WritableStream",
  "WritableStreamDefaultWriter",
] }

# Natively, multiplayer is WebTransport (QUIC) through wtransport, on a tokio runtime.
# `dangerous-configuration` is for joining a development server with a throwaway
# certificate; `self-signed` makes that certificate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "self-signed", "dangerous-configuration"] }
# The server tells a Telegram bot who joins and leaves (`bin/server.rs`).
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Fast-ish debug builds: optimize dependencies, keep our own crate quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo run` in the dev shell: release optimizations without LTO, with fast incremental rebuilds.
[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Used by the Nix wasm package: smaller download at a small runtime cost.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
